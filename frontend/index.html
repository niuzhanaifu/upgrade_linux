<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 升级平台</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Firmware Ops</p>
        <h1>升级平台</h1>
      </div>
      <div class="status-pill" id="serviceStatus">连接中</div>
    </header>

    <nav class="product-tabs" aria-label="升级类型">
      <button class="tab-button active" id="esp32Tab" type="button" data-target="esp32View">ESP32升级</button>
      <button class="tab-button" id="linuxTab" type="button" data-target="linuxView">Linux升级</button>
    </nav>

    <main class="layout product-view active" id="esp32View">
      <section class="panel actions-panel">
        <div class="section-heading">
          <div>
            <h2>操作</h2>
            <p>拉取代码、编译固件、查询升级包</p>
          </div>
        </div>
        <div class="action-grid">
          <button class="primary-button" id="incrementalBuildButton" type="button">
            <span class="button-icon">▶</span>
            <span>增量编译</span>
          </button>
          <button class="primary-button" id="fullBuildButton" type="button">
            <span class="button-icon">●</span>
            <span>全量编译</span>
          </button>
          <button class="secondary-button" id="upgradeButton" type="button">
            <span class="button-icon">↑</span>
            <span>获取升级包信息</span>
          </button>
        </div>
        <div class="config-list" id="configList"></div>
        <div class="publish-panel" id="otaPublishPanel" hidden>
          <div class="publish-heading">
            <strong>OTA发布</strong>
            <span id="otaPublishStatus">选择一个升级包后发布</span>
          </div>
          <label class="form-label" for="otaPackageSelect">升级包</label>
          <select class="form-control" id="otaPackageSelect"></select>
          <label class="form-label" for="otaPublishPassword">发布密码</label>
          <input class="form-control" id="otaPublishPassword" type="password" autocomplete="current-password" />
          <button class="primary-button publish-submit" id="otaPublishSubmit" type="button">发布</button>
          <div class="publish-history" id="otaPublishHistory"></div>
        </div>
      </section>

      <section class="panel log-panel">
        <div class="section-heading">
          <div>
            <h2>任务输出</h2>
            <p id="jobMeta">暂无任务</p>
          </div>
          <button class="ghost-button" id="refreshButton" type="button">刷新</button>
        </div>
        <pre class="log-view" id="logView">等待操作...</pre>
        <div class="ota-records-panel">
          <div class="ota-records-header">
            <div>
              <h2>OTA升级记录</h2>
              <p>设备请求固件升级检查的记录</p>
            </div>
            <div class="ota-stats" id="otaStats"></div>
          </div>
          <div class="ota-record-list" id="otaRecordList"></div>
        </div>
      </section>

      <section class="panel history-panel">
        <div class="section-heading">
          <div>
            <h2>历史任务</h2>
            <p>最近的编译和升级包查询记录</p>
          </div>
        </div>
        <div class="job-list" id="jobList"></div>
      </section>

      <section class="panel firmware-panel">
        <details class="record-collapse" id="firmwareDetails">
          <summary>
            <span>
              <strong>固件下载</strong>
              <small>编译成功后生成的固件 · <span id="firmwareCount">0</span></small>
            </span>
            <span class="summary-icon">⌄</span>
          </summary>
          <div class="firmware-list" id="firmwareList"></div>
        </details>
      </section>

      <section class="panel build-record-panel">
        <details class="record-collapse" id="buildRecordDetails">
          <summary>
            <span>
              <strong>编译记录</strong>
              <small>触发时间、结果和存放目录 · <span id="buildRecordCount">0</span></small>
            </span>
            <span class="summary-icon">⌄</span>
          </summary>
          <div class="record-list" id="buildRecordList"></div>
        </details>
      </section>
    </main>

    <main class="layout product-view" id="linuxView" hidden>
      <section class="panel linux-panel">
        <div class="section-heading">
          <div>
            <h2>Linux升级</h2>
            <p>后端能力暂未接入</p>
          </div>
        </div>
        <div class="placeholder-box">
          <strong>待实现</strong>
          <p>这里将用于 Linux 服务代码拉取、编译、发布和升级。当前只完成前端入口。</p>
        </div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
